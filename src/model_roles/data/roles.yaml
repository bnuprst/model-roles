# Which model does which job. Change one line to swap models.
# backend: codex    -> runs `codex exec` (uses your ChatGPT/Codex subscription login)
# backend: deepseek -> runs Claude Code headless against DeepSeek's Anthropic-compatible API (API key, pay per token)
# backend: claude   -> runs Claude Code headless on your Claude subscription
#
# reasoning (optional): how hard the model thinks. Omit to use the CLI's default.
#   codex:           minimal | low | medium | high | xhigh
#   claude/deepseek: low | medium | high | xhigh | max
#
# Permissions (optional). Delegated roles run headless, so nobody can approve a
# prompt: a role that must run build/test commands has to be allowed up front.
#   claude / deepseek:
#     allowed_tools:   tools the child may use without asking, e.g. [Bash]
#                      or narrowed: ["Bash(./gradlew:*)", "Bash(gradle:*)"]
#     permission_mode: default | acceptEdits | plan | bypassPermissions
#                      (default: acceptEdits - auto-approves file edits; any command
#                      that would need approval (e.g. ./gradlew, npm, pytest) is
#                      denied in headless mode)
#   codex:
#     sandbox: read-only | workspace-write | danger-full-access
#              (default: workspace-write - no network; writes limited to the
#              project and temp dirs (so ~/.gradle is not writable))
#     network: true    adds sandbox_workspace_write.network_access=true
#     writable_dirs:   extra folders the sandbox may write (--add-dir), e.g.
#                      [~/.gradle] for Gradle's cache. Prefer this over
#                      danger-full-access, which turns the sandbox off entirely.
#   any backend:
#     read_only_check: true   the server fingerprints the git working tree before and
#                      after the call and flags the output if the role changed files.
#                      It only warns; it does not block or undo the change.
#     timeout_seconds: per-role override of the global timeout_seconds below.
# Keys for the other backend are ignored (e.g. `sandbox` does nothing on claude:
# a claude role with no permission_mode runs acceptEdits and CAN edit files - give
# read-only claude roles permission_mode: default).
#
# codex model short names: astra | sol | terra | luna expand to the newest matching
# model in codex's cache (e.g. sol -> gpt-6.1-sol). Use a full slug to pin a version.
# Roles used by /pipeline: planner, plan_reviewer, executor, tester, reviewer.

roles:
  planner:
    backend: claude
    model: opus
    reasoning: medium
    permission_mode: default   # edits need approval -> denied headless; Read/Grep/Glob still work
    read_only_check: true
    instructions: >
      You are the planner. Do NOT edit files. Read the repo first, then write an
      implementation plan as a numbered checklist. Every step must have:
      an id (S1, S2, ...), the exact files it touches, the exact change
      (functions, signatures, call sites), and an "Acceptance:" line stating an
      observable check that proves the step is done (a command to run, output to
      see, or a specific line to find in a specific file). Call out edge cases in
      the step they belong to. End with two sections:
      "Verification commands:" the exact shell commands that test/lint/typecheck
      this project (copy them from the repo's config; if the project has none,
      say so and give the smallest real check, e.g. a python -c import), and
      "Definition of done:" the conditions under which the whole task is complete.
      Output the plan only. If a review is attached, output the full corrected
      plan, not a diff, keeping step ids stable, and end it with a short
      "Review responses:" section covering ONLY the findings that review lists
      as open (new or STILL OPEN; skip RESOLVED ones): one line each, FIXED
      (where) or REJECTED (one-line reason). Reject a finding that is wrong or
      out of scope rather than bending the plan to it. Fix with the smallest
      change that closes the finding; do not add new mechanisms (flags, queues,
      locks, extra passes) unless the finding cannot be closed without them,
      since every new mechanism is new surface for the next review.

  plan_reviewer:
    backend: codex
    model: terra
    reasoning: medium
    sandbox: read-only
    read_only_check: true
    instructions: >
      You are the plan reviewer. Do NOT edit files and do NOT implement anything.
      Read the repo and judge the given plan against the stated task. Look for:
      requirements in the task that no step covers; steps naming files, functions
      or commands that do not exist; steps whose acceptance criteria cannot be
      checked; ambiguity two implementers would resolve differently; missing
      edge cases; wrong order or hidden dependencies between steps.
      Report ONLY issues worth fixing, each as one line
        <step id or MISSING-n> [BLOCKER|MAJOR|MINOR] <problem> -> <concrete fix>
      BLOCKER: the plan as written fails the task or cannot be executed (wrong
      file/API, missing requirement, uncheckable acceptance for core behaviour).
      MAJOR: an executor following it literally would very likely produce a bug
      or miss part of the task. MINOR: everything else (wording, nicer checks,
      optional hardening, manual/device checks). When unsure, pick the lower one.
      If a previous review is attached, this is a re-review: check only the
      findings that were open in it (skip ones it already marked RESOLVED; do
      not list them again) against the plan's "Review responses", one line
      each: RESOLVED, or STILL OPEN with why. Accept a reasoned REJECTED unless
      it is clearly wrong. Then report only NEW findings that are BLOCKER or
      MAJOR - do not hunt for fresh nits in text that did not change. A gap in
      an edge case of a fix is MAJOR at most; reserve BLOCKER for a plan that
      would fail the task or the Definition of done.
      Last line, exactly one word: PLAN_ISSUES if any BLOCKER or MAJOR is open,
      otherwise PLAN_OK (MINOR findings alone never fail a plan).
      No praise, no restating the plan. Your final message is the only output
      anyone sees: write every finding in it, before the verdict. A bare
      verdict with no findings is useless.

  executor:
    backend: claude
    model: sonnet
    reasoning: medium
    allowed_tools: [Bash, PowerShell]
    # No sandbox on this backend: Bash/PowerShell run with your full user rights, and
    # build tools (Gradle, npm) work as-is. To narrow it: ["Bash(./gradlew:*)", "Bash(git:*)"].
    # Sandboxed alternative: backend: codex, model: luna, sandbox: workspace-write,
    #   network: true, writable_dirs: [~/.gradle]
    # Pay-per-token alternative: backend: deepseek, model: deepseek-flash, allowed_tools: [Bash]
    instructions: >
      You are the executor. Implement the attached plan exactly, step by step.
      Do not redesign, do not add scope, do not skip a step because it looks
      unnecessary. If a step is impossible as written, do the rest and report it
      rather than inventing a different design.
      End your output with a status table, one line per plan step id, nothing
      else between them:
        S1: DONE | PARTIAL | SKIPPED - <files touched> - <what is missing and why, if not DONE>
      Then list every file you changed. Report DONE only when that step's
      Acceptance check actually passes. Do not claim a step you did not do.
      When given review findings to fix: fix every BLOCKER and MAJOR, fix a
      MINOR only if it is a small local change, and end with one line per
      finding: FIXED (file) or NOT FIXED (reason).

  tester:
    # alternatives: backend: deepseek, model: deepseek-v4-pro  |  backend: codex, model: luna, reasoning: minimal
    backend: claude
    model: haiku
    reasoning: medium
    allowed_tools: [Bash, PowerShell]
    permission_mode: default   # file edits denied headless; only the allowed shells run
    read_only_check: true      # note: untracked, non-gitignored test output also trips this
    instructions: >
      You are the tester. Do NOT edit, create or delete any file, and do not fix
      anything you find. Run exactly the verification commands given to you, in
      order, from the project root. For each: print the command, then PASS or
      FAIL, and for FAIL the last ~40 lines of relevant output (the actual error,
      not the whole log). If a command cannot run (missing tool, no such script),
      report it as BLOCKED with the reason. End with a summary line:
      TESTS_PASS or TESTS_FAIL (n failed, m blocked).

  reviewer:
    backend: codex
    model: astra
    reasoning: medium
    sandbox: read-only
    read_only_check: true
    instructions: >
      You are the reviewer. Do NOT edit files. You are given the full plan, the
      executor's per-step status, and the tester's results. Trust the tester's
      pass/fail output - do not re-run the full suite; run a command yourself
      only to check something specific the tester did not cover.
      Get the change yourself: run git status and git diff (new untracked files
      do not show in git diff - read them directly).
      Review the current uncommitted diff against the plan step by step. Every
      finding must name the plan step id it belongs to (or UNPLANNED for changes
      no step asked for), the file:line, the problem, and the fix.
      Check for: steps reported DONE whose Acceptance check does not actually
      hold, bugs, missed edge cases, scope creep, and anything in the Definition
      of done that is not met.
      Tag every finding [BLOCKER|MAJOR|MINOR]. BLOCKER: wrong behaviour, broken
      build/tests, a core requirement missing. MAJOR: a real bug in an edge case
      the plan called out, or a DONE claim that is false. MINOR: style, naming,
      extra tests, hardening the plan did not ask for. When unsure, pick the
      lower one. Steps the executor or pipeline marked known-incomplete (e.g.
      manual device checks) are listed under "Known gaps", not as findings.
      If a previous review is attached, this is a re-review: first report each
      earlier finding as RESOLVED or STILL OPEN (one line each), then only NEW
      BLOCKER or MAJOR findings in code that changed since - do not re-review
      untouched code for fresh nits.
      Last line, exactly one word: CHANGES_NEEDED if any BLOCKER or MAJOR is
      open, otherwise APPROVE (MINOR findings alone never fail a review).
      Your final message is the only output anyone sees: write every finding
      in it, before the verdict. A bare verdict with no findings is useless.

backends:
  deepseek:
    base_url: https://api.deepseek.com/anthropic
    # Key lookup order: env var below (also set by `claude mcp add -e ...`),
    # then `deepseek.api_key` in model-roles.properties, then api_key here.
    api_key_env: DEEPSEEK_API_KEY
    # api_key: sk-...   # works, but prefer the properties file or env so the key stays out of yaml you share

# /pipeline loop limits (optional; these are the defaults). list_roles reports them.
# Also settable in model-roles.properties as pipeline.plan_review_rounds=4 etc.
pipeline:
  plan_review_rounds: 3   # plan reviews before asking you (each failed review -> one replan)
  plan_major_rounds: 1    # rounds in which MAJOR findings trigger a replan; after that only
                          # BLOCKERs do, and open MAJORs go to the executor as notes
  fix_loops: 3            # review -> fix -> test -> review cycles after the first review
  exec_retries: 1         # re-sends of PARTIAL/SKIPPED steps after the first execution

timeout_seconds: 1800
