[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-roles"
version = "0.1.0"
description = "MCP server that lets Claude Code delegate work to role-based models (Codex, DeepSeek, Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pyyaml>=6"]

[project.scripts]
model-roles = "model_roles.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_roles"]
